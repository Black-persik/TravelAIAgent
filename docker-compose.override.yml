# Local development only. Compose merges this file into docker-compose.yml automatically.
# It is never copied to the server.
services:
  api:
    build: .
    environment:
      APP_ENV: local  # http cookies on localhost, API docs at /api/docs
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app  # edit code without rebuilding the image
    command:
      ["uvicorn", "app.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"  # inspect the database from your machine
