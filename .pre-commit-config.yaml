# Install once per clone: uvx pre-commit install
# Run on all files:      uvx pre-commit run --all-files
repos:
  # Blocks commits that contain API keys, tokens and other secrets.
  # A local wrapper instead of the upstream golang hook: it downloads a pinned,
  # checksum-verified gitleaks binary, so it works without a Go toolchain
  # (including cloud sessions). See scripts/gitleaks-hook.sh.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
        entry: scripts/gitleaks-hook.sh
        language: script
        pass_filenames: false
        always_run: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
